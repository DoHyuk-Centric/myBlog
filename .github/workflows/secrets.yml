name: Secrets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-tracked-env:
    name: .env 추적 여부 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-tracked-env.sh

  gitleaks:
    name: 시크릿 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
